name: harness-ocr
services:
  lease-init:
    image: ${HARNESS_IMAGE:-harness-ocr:0.1.0rc6}
    user: "0:0"
    entrypoint: ["python", "/app/scripts/init_shared_locks.py"]
    command: ["--lock-dir", "/locks"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - harness_device_locks:/locks
    restart: "no"
  ocr:
    image: ${HARNESS_IMAGE:-harness-ocr:0.1.0rc6}
    user: "${HARNESS_UID:-10001}:${HARNESS_GID:-10001}"
    depends_on:
      lease-init:
        condition: service_completed_successfully
    build:
      context: .
      args:
        PYTHON_IMAGE: ${HARNESS_PYTHON_IMAGE:-python:3.12.16-slim-bookworm@sha256:0f086103b026048cc50cb5da25ec435c023c5241a83fc44daea593377abc61c4}
        HARNESS_INSTALL_YOLO: ${HARNESS_INSTALL_YOLO:-0}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HARNESS_PORT:-8080}:8080"
    environment:
      HARNESS_API_TOKEN: ${HARNESS_API_TOKEN:?Set a private API token}
      HARNESS_REVIEW_TOKEN: ${HARNESS_REVIEW_TOKEN:?Set a separate private review token}
      HARNESS_DATA: /var/lib/harness
      HARNESS_MODELS: /models
      HARNESS_LOCK_DIR: /var/lib/harness/locks
      HARNESS_DEVICE: cuda
      HARNESS_DTYPE: bfloat16
      HARNESS_QWEN: ${HARNESS_QWEN:-qwen-0.8b}
      HARNESS_TEXT_DETECTOR: ${HARNESS_TEXT_DETECTOR:-db}
      HARNESS_READING_POLICY: ${HARNESS_READING_POLICY:-adaptive}
      HARNESS_RESCUE_TEXT_DETECTOR: ${HARNESS_RESCUE_TEXT_DETECTOR:-none}
      HARNESS_MAX_DETECTOR_RESCUES: "${HARNESS_MAX_DETECTOR_RESCUES:-1}"
      HARNESS_MAX_WHOLE_PAGE_READS: "${HARNESS_MAX_WHOLE_PAGE_READS:-1}"
      HARNESS_MAX_INPUT_TOKENS: "${HARNESS_MAX_INPUT_TOKENS:-32768}"
      HARNESS_MAX_NEW_TOKENS: "${HARNESS_MAX_NEW_TOKENS:-1024}"
      HARNESS_CALL_TIMEOUT_SECONDS: "${HARNESS_CALL_TIMEOUT_SECONDS:-300}"
      HARNESS_DOCUMENT_TIMEOUT_SECONDS: "${HARNESS_DOCUMENT_TIMEOUT_SECONDS:-900}"
      HARNESS_ATTENTION_BACKEND: ${HARNESS_ATTENTION_BACKEND:-sdpa}
      HARNESS_VISUAL_VERIFIER: ${HARNESS_VISUAL_VERIFIER:-1}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - type: bind
        source: ${HARNESS_MODELS_HOST:-./models}
        target: /models
        read_only: true
      - harness_data:/var/lib/harness
      - harness_device_locks:/var/lib/harness/locks
      - harness_reports:/reports
    read_only: true
    tmpfs:
      - /tmp:size=2147483648,mode=1777
    shm_size: 2gb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${HARNESS_GPU_ID:-0}"]
              capabilities: [gpu]
volumes:
  harness_device_locks:
    external: true
    name: ${HARNESS_LOCK_VOLUME:-harness-ocr-device-locks}
  harness_data:
  harness_reports:
