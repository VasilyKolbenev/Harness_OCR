name: Verify Harness OCR
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      docker_build:
        description: Build the CUDA image and run offline import smoke (no GPU or models)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: harness-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, deployment/actions-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install service, inference utilities and MCP (no torch/model download)
        run: python -m pip install '.[inference,mcp]'
      - name: Verify dependencies and syntax
        run: |
          python -m pip check
          python -m compileall -q src scripts
          python -m harness_ocr.cli profiles
      - name: Test software contracts (fixtures, local HTTP/MCP and worker lifecycle)
        run: python -m unittest discover -s tests -v
      - name: Check source handoff
        run: python scripts/build_release.py --output /tmp/harness-ocr-source.zip
  cuda-image-build:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.docker_build)
    needs: software-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check runner disk before CUDA build
        run: |
          df -h /
          docker system df
          available_kib=$(df --output=avail / | tail -n 1 | tr -d ' ')
          if [ "$available_kib" -lt 12582912 ]; then
            echo 'Insufficient runner disk: CUDA build requires at least 12 GiB free before build. Use a larger runner; no SDK/user files were removed.'
            exit 1
          fi
      - name: Build exact candidate Dockerfile
        run: docker build --progress plain --tag harness-ocr:ci .
      - name: Offline imports in the built image (not GPU acceptance)
        run: |
          docker run --rm --network none --entrypoint python harness-ocr:ci -c "import torch, torchvision; from transformers.models.qwen3_5.modeling_qwen3_5 import Qwen3_5ForConditionalGeneration; import harness_ocr.api, harness_ocr.mcp_server; assert torch.version.cuda == '13.2'; print('CUDA image import smoke passed; actual GPU inference remains unverified')"
          docker run --rm --network none --entrypoint python harness-ocr:ci -m harness_ocr.cli profiles
      - name: Record actual built image
        run: docker image inspect harness-ocr:ci --format '{{.Id}}'
