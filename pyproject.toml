[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-ocr"
version = "0.1.0rc3"
description = "Evidence-grounded Russian document OCR harness"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.4", "uvicorn==0.54.0", "httpx==0.28.1", "pydantic==2.14.3", "Pillow==13.0.0", "pypdfium2==5.15.2", "PyYAML==6.0.3", "defusedxml==0.7.1", "lxml==6.1.3"]

[project.optional-dependencies]
inference = ["transformers==5.2.0", "numpy==2.4.6", "safetensors==0.8.0", "onnxruntime==1.31.1", "opencv-python-headless==5.0.0.93", "pyclipper==1.4.0", "lm-format-enforcer==0.11.3"]
mcp = ["mcp==2.3.0"]

[project.scripts]
harness-ocr = "harness_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness_ocr = ["data/*.json", "profiles/data/*.json", "native/data/*.json", "native/data/*.xsd", "native/data/*.txt"]
